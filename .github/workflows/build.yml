name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neo-Backup-Release
          # ✅ 这个项目是单模块结构（代码直接在根目录 src/main/java 下，没有 app/ 子模块），
          # 之前写的 app/build/outputs/... 这个路径根本不存在，导致上传步骤匹配不到任何文件、
          # 静默不上传任何产物（assembleRelease 本身成功所以 job 仍显示绿色，容易误以为"编译成功=有APK可下"）
          path: build/outputs/apk/release/*.apk
